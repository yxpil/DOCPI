<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>DocPI · 开发文档公示</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' }
          }
        }
      }
    };
  </script>
</head>
<body class="h-screen w-screen overflow-hidden bg-white text-neutral-900 dark:bg-black dark:text-neutral-100 antialiased">

  <!-- 顶栏 -->
  <header class="h-14 flex items-center gap-2 sm:gap-3 px-3 sm:px-4 border-b border-neutral-200 dark:border-neutral-800 bg-white dark:bg-black select-none">
    <!-- 移动端菜单按钮 -->
    <button id="btnMenu" title="菜单" class="md:hidden h-9 w-9 flex items-center justify-center rounded-full text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition shrink-0">
      <span id="menuIcon"></span>
    </button>
    <div class="flex items-center gap-2.5 min-w-0">
      <span id="logoIcon" class="text-brand-600 dark:text-brand-400 shrink-0"></span>
      <span id="siteName" class="font-semibold text-base tracking-tight truncate">DocPI</span>
    </div>

    <div class="flex-1 max-w-xl mx-auto relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 dark:text-neutral-500 pointer-events-none" id="searchIcon"></span>
      <input id="searchInput" type="text" placeholder="搜索文档 / 文件夹 / 项目 / 仓库地址…"
        class="w-full h-9 pl-9 pr-3 rounded-full text-sm bg-neutral-100 dark:bg-neutral-900 border border-transparent focus:border-brand-500 focus:bg-white dark:focus:bg-black outline-none transition" />
      <div id="searchPanel" class="hidden absolute top-full mt-2 left-0 right-0 rounded-2xl shadow-lg border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-black max-h-96 overflow-y-auto z-50"></div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <!-- 设置按钮（区别于主题按钮） -->
      <button id="btnSettings" title="设置" class="hidden h-9 px-2.5 rounded-full text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition"></button>
      <!-- 主题切换 -->
      <button id="btnTheme" title="切换主题" class="h-9 w-9 flex items-center justify-center rounded-full text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition">
        <span id="themeIcon"></span>
      </button>
      <div id="userArea" class="flex items-center gap-2"></div>
    </div>
  </header>

  <div class="flex relative" style="height: calc(100vh - 3.5rem);">
    <!-- 侧边遮罩（移动端） -->
    <div id="drawerOverlay" class="md:hidden fixed inset-0 top-14 bg-black/40 backdrop-blur-[2px] z-30 opacity-0 pointer-events-none transition-opacity duration-200"></div>

    <!-- 左侧栏 -->
    <aside id="sidebar" class="w-80 min-w-[300px] border-r border-neutral-200 dark:border-neutral-800 bg-white dark:bg-black flex flex-col shrink-0 z-40">
      <!-- 项目管理（可折叠区块） -->
      <div class="border-b border-neutral-100 dark:border-neutral-800">
        <div class="flex items-center justify-between px-3 pt-3 pb-1.5">
          <button id="btnToggleProjects" class="flex items-center gap-1 text-xs font-semibold text-neutral-500 dark:text-neutral-400 uppercase tracking-wider hover:text-neutral-700 dark:hover:text-neutral-200 transition">
            <span id="projectsChevron" class="tree-chevron text-neutral-400 inline-flex items-center justify-center w-3.5 h-3.5"></span>
            <span>项目管理</span>
          </button>
          <button id="btnAddProject" class="hidden h-6 px-2.5 rounded-full text-xs font-medium text-brand-600 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="新建项目"></button>
        </div>
        <div id="projectListWrap" class="overflow-y-auto scroll-thin px-2 pb-2" style="max-height: 38vh;">
          <div id="projectList" class="space-y-1">
            <div class="sk sk-line" style="width:70%;margin:6px 0;"></div>
            <div class="sk sk-line" style="width:60%;margin:6px 0;"></div>
          </div>
        </div>
      </div>

      <!-- 文件夹 -->
      <div class="px-3 py-2 flex items-center justify-between">
        <span class="text-xs font-semibold text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">文件夹</span>
        <button id="btnAddRootFolder" class="hidden h-6 px-2.5 rounded-full text-xs font-medium text-neutral-500 dark:text-neutral-400 hover:text-brand-600 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition">+ 新建</button>
      </div>
      <div id="tree" class="flex-1 overflow-y-auto py-1 scroll-thin">
        <div class="px-2 space-y-2">
          <div class="sk sk-line" style="width:80%;"></div>
          <div class="sk sk-line" style="width:65%;"></div>
          <div class="sk sk-line" style="width:72%;"></div>
        </div>
      </div>
    </aside>

    <!-- 右侧内容 -->
    <main class="flex-1 overflow-y-auto scroll-thin bg-white dark:bg-black min-w-0">
      <div id="contentArea" class="p-4 sm:p-6">
        <!-- 首屏骨架占位（由 main.js 加载完成后替换） -->
        <div id="bootSkeleton" class="max-w-4xl mx-auto fade-in">
          <div class="sk sk-line" style="width:55%;height:22px;margin-bottom:14px;"></div>
          <div class="flex gap-2 mb-5">
            <div class="sk sk-line" style="width:84px;height:20px;"></div>
            <div class="sk sk-line" style="width:96px;height:20px;"></div>
            <div class="sk sk-line" style="width:120px;height:20px;"></div>
          </div>
          <div class="sk sk-block" style="width:100%;margin-bottom:10px;"></div>
          <div class="sk sk-block" style="width:92%;margin-bottom:10px;"></div>
          <div class="sk sk-block" style="width:97%;margin-bottom:10px;"></div>
          <div class="sk sk-block" style="width:78%;margin-bottom:18px;"></div>
          <div class="sk sk-block" style="width:100%;height:90px;margin-bottom:14px;border-radius:14px;"></div>
          <div class="sk sk-block" style="width:88%;margin-bottom:10px;"></div>
          <div class="sk sk-block" style="width:60%;"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 弹窗容器 -->
  <div id="modalRoot"></div>

  <!-- Toast -->
  <div id="toastRoot" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script type="module" src="js/main.js?v=20260827074532"></script>
</body>
</html>
