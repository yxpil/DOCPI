[package]
name = "docpi"
version = "3.0.0"
edition = "2021"
description = "开发文档公示软件 - Rust 后端（axum + rusqlite）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
scrypt = "0.11"
rand = "0.8"
png = "0.17"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
chrono = "0.4"

[profile.release]
strip = true
lto = true
